<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b7a5f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Scanner">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <title>Scanner</title>
</head>
<body>

  <!-- ============ Documento (tela inicial) ============ -->
  <section id="screen-home" class="screen active">
    <header class="topbar">
      <input id="doc-name" class="doc-name" aria-label="Nome do documento" autocomplete="off" spellcheck="false">
      <button id="btn-new" class="icon-btn" title="Novo documento" aria-label="Novo documento">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 12v6M9 15h6"/></svg>
      </button>
    </header>

    <main class="home-main">
      <p id="page-count" class="page-count"></p>
      <div id="pages" class="pages"></div>
      <div id="empty" class="empty">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/></svg>
        <h3>Nenhuma página ainda</h3>
        <p>Toque em <b>Câmera</b> para fotografar um documento ou em <b>Galeria</b> para importar fotos.</p>
      </div>
    </main>

    <nav class="bottombar">
      <label class="action">
        <input type="file" id="in-camera" class="vh" accept="image/*" capture="environment">
        <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        Câmera
      </label>
      <label class="action">
        <input type="file" id="in-gallery" class="vh" accept="image/*" multiple>
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        Galeria
      </label>
      <button id="btn-export" class="action primary" disabled>
        <svg viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>
        Gerar PDF
      </button>
    </nav>
  </section>

  <!-- ============ Ajustar bordas ============ -->
  <section id="screen-crop" class="screen dark">
    <header class="topbar">
      <button id="crop-cancel" class="text-btn">Cancelar</button>
      <h2>Ajustar bordas</h2>
      <button id="crop-next" class="text-btn strong">Próximo</button>
    </header>
    <div id="crop-stage" class="stage">
      <div id="crop-wrap" class="crop-wrap">
        <img id="crop-img" alt="" draggable="false">
        <svg id="crop-svg" class="crop-svg" preserveAspectRatio="none"></svg>
      </div>
      <canvas id="loupe" class="loupe"></canvas>
      <div id="crop-status" class="status-pill" hidden></div>
    </div>
    <footer class="toolbar">
      <button id="crop-auto" class="tool">
        <svg viewBox="0 0 24 24"><path d="M15 4V2M15 16v-2M8 9h2M20 9h2M17.8 11.8L19 13M17.8 6.2L19 5M3 21l9-9M12.2 6.2L11 5"/></svg>
        Auto
      </button>
      <button id="crop-full" class="tool">
        <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        Página inteira
      </button>
    </footer>
  </section>

  <!-- ============ Filtro ============ -->
  <section id="screen-filter" class="screen dark">
    <header class="topbar">
      <button id="filter-back" class="text-btn">Voltar</button>
      <h2>Filtro</h2>
      <button id="filter-save" class="text-btn strong">Salvar</button>
    </header>
    <div class="stage">
      <canvas id="filter-canvas" class="filter-canvas"></canvas>
    </div>
    <footer class="toolbar column">
      <div id="filter-chips" class="chips"></div>
      <div class="row">
        <button id="rot-left" class="tool">
          <svg viewBox="0 0 24 24"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          Girar
        </button>
        <button id="rot-right" class="tool">
          <svg viewBox="0 0 24 24"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          Girar
        </button>
      </div>
    </footer>
  </section>

  <!-- ============ Folhas (bottom sheets) ============ -->
  <div id="sheet-backdrop" class="backdrop"></div>

  <div id="sheet-page" class="sheet" role="dialog" aria-label="Opções da página">
    <div class="grabber"></div>
    <h3 id="page-sheet-title" class="sheet-title">Página</h3>
    <button class="sheet-item" data-act="edit">
      <svg viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>
      Editar recorte e filtro
    </button>
    <button class="sheet-item" data-act="left">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      Mover para antes
    </button>
    <button class="sheet-item" data-act="right">
      <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
      Mover para depois
    </button>
    <button class="sheet-item danger" data-act="delete">
      <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
      Excluir página
    </button>
  </div>

  <div id="sheet-export" class="sheet" role="dialog" aria-label="Gerar PDF">
    <div class="grabber"></div>
    <h3 class="sheet-title">Gerar PDF</h3>
    <div class="field">
      <span class="field-label">Tamanho do papel</span>
      <div class="seg" data-opt="paper">
        <button data-val="a4">A4</button>
        <button data-val="letter">Carta</button>
        <button data-val="fit">Imagem</button>
      </div>
    </div>
    <div class="field">
      <span class="field-label">Qualidade</span>
      <div class="seg" data-opt="quality">
        <button data-val="high">Alta</button>
        <button data-val="medium">Média</button>
        <button data-val="low">Pequena</button>
      </div>
      <span class="field-hint">Use “Pequena” para arquivos leves no WhatsApp/e-mail.</span>
    </div>
    <button id="btn-build" class="btn primary">Gerar PDF</button>
    <div id="export-result" class="export-result" hidden>
      <p id="export-info" class="export-info"></p>
      <div class="row2">
        <button id="btn-share" class="btn primary">
          <svg viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>
          Compartilhar
        </button>
        <button id="btn-download" class="btn">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
          Baixar
        </button>
      </div>
    </div>
  </div>

  <div id="sheet-confirm" class="sheet" role="alertdialog">
    <div class="grabber"></div>
    <h3 id="confirm-title" class="sheet-title"></h3>
    <p id="confirm-text" class="sheet-text"></p>
    <div class="row2">
      <button id="confirm-cancel" class="btn">Cancelar</button>
      <button id="confirm-ok" class="btn danger-fill"></button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="busy" class="busy"><div class="spinner"></div><p id="busy-text"></p></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
